name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      THIRDWEB_SECRET_KEY: ${{ secrets.THIRDWEB_SECRET_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_SA_KEY_2: ${{ secrets.GCP_SA_KEY_2 }}  # si usas segunda cuenta

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Authenticate Google Cloud (primer secreto)
        run: |
          echo "$GCP_SA_KEY" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project useful-memory-464107-d6

      # Opcional: autenticar segunda cuenta si la necesitas
      - name: Authenticate Google Cloud (segunda cuenta)
        if: env.GCP_SA_KEY_2 != ''
        run: |
          echo "$GCP_SA_KEY_2" > gcp-key2.json
          gcloud auth activate-service-account --key-file=gcp-key2.json

      - name: Deploy to Google Cloud
        run: |
          # Reemplaza con tu comando real de deploy
          echo "Despliegue simulado: reemplaza con tu comando real"

      - name: Test Thirdweb SDK
        run: |
          node -e "import('https://esm.sh/@thirdweb-dev/sdk').then(({ ThirdwebSDK }) => {
            const sdk = new ThirdwebSDK('base', { clientId: process.env.THIRDWEB_SECRET_KEY });
            console.log('SDK conectado a Base Mainnet', sdk);
          });"

