name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      THIRDWEB_SECRET_KEY: ${{ secrets.THIRDWEB_SECRET_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Authenticate Google Cloud
        run: |
          # Guardar el JSON del service account en un archivo
          echo "${{ secrets.GCP_SA_KEY }}" > gcp-key.json
          # Opcional: mostrar el JSON para debug (quítalo en producción)
          # cat gcp-key.json
          # Autenticar con gcloud
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project useful-memory-464107-d6

      - name: Deploy to Google Cloud
        run: |
          # Reemplaza con tu comando real, por ejemplo:
          # gcloud app deploy app.yaml --quiet
          # o para GKE / Cloud Run
          echo "Aquí va tu comando de deploy real a Google Cloud"

      - name: Test Thirdweb SDK
        run: |
          node -e "import('https://esm.sh/@thirdweb-dev/sdk').then(({ ThirdwebSDK }) => {
            const sdk = new ThirdwebSDK('base', { clientId: process.env.THIRDWEB_SECRET_KEY });
            console.log('SDK conectado a Base Mainnet', sdk);
          });"

