name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'

      - name: Authenticate Google Cloud
        run: |
          printf "%s" "$GCP_SA_KEY" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project useful-memory-464107-d6

      - name: Build Docker image
        run: |
          gcloud builds submit --tag gcr.io/useful-memory-464107-d6/my-image .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-service \
            --image gcr.io/useful-memory-464107-d6/my-image \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

