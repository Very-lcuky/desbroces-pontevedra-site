name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      THIRDWEB_SECRET_KEY: ${{ secrets.THIRDWEB_SECRET_KEY }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Authenticate Google Cloud
        run: |
          printf "%s" "$GCP_SA_KEY" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project useful-memory-464107-d6

      - name: Build Docker image
        run: |
          docker build -t gcr.io/useful-memory-464107-d6/my-service:latest .

      - name: Push Docker image to Google Container Registry
        run: |
          gcloud auth configure-docker
          docker push gcr.io/useful-memory-464107-d6/my-service:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy my-service \
            --image gcr.io/useful-memory-464107-d6/my-service:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

      - name: Test Thirdweb SDK
        run: |
          node -e "import('https://esm.sh/@thirdweb-dev/sdk').then(({ ThirdwebSDK }) => {
            const sdk = new ThirdwebSDK('base', { clientId: process.env.THIRDWEB_SECRET_KEY });
            console.log('SDK conectado a Base Mainnet', sdk);
          });"

